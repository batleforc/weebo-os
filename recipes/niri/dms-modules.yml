modules:
  # Dux Modular Shell (DMS, formerly DankMaterialShell), the desktop shell used by the niri and niri-vm images.
  #
  # ddcutil drives external monitors over DDC/CI (brightness, input, colour
  # preset). DMS has its own DDC client (`dms brightness --ddc`) but needs the
  # user to open /dev/i2c-*: ddcutil's 60-ddcutil-i2c.rules grants that to the
  # seat user. Without it, access only worked because the uBlue base happens to
  # ship openrgb-udev-rules, which nothing here asks for.
  - type: dnf
    repos:
      copr:
        enable:
          - duxlabs/dms
    install:
      install-weak-deps: false
      packages:
        - dms
        - ddcutil
  - type: script
    scripts:
      - niri/init.sh
  - type: systemd
    user:
      enabled:
        - dms
