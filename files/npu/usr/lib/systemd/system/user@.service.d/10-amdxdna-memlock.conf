# The XDNA NPU maps its buffers with locked memory, so the default RLIMIT_MEMLOCK
# is far too small for anything but the smallest models.
#
# xrt-plugin-amdxdna ships /etc/security/limits.d/90-amdxdna-memlock.conf, which
# pam_limits applies to login sessions. Services started by the per-user systemd
# manager do not inherit that, so the limit has to be raised here too. This is
# the drop-in AMD's Fedora instructions ask you to write by hand with
# `systemctl edit user@.service`.
[Service]
LimitMEMLOCK=infinity
